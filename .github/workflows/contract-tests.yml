name: CellIO contracts

on: [push, pull_request]

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m cellio validate --config examples/cell_a/healthy.yaml
      - run: python -m cellio validate --config examples/cell_b/healthy.yaml
      - run: python -m cellio acceptance --level r0 --report work/r0.json
