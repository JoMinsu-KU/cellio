[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cellio"
version = "1.1.0.dev1"
description = "Scene-bound I/O fault injection and regression testing for robotic workcells"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
dependencies = ["PyYAML>=6,<7", "jsonschema>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "hypothesis>=6,<7", "coverage>=7,<8", "mypy>=1,<2", "ruff>=0,<1"]
plots = ["matplotlib==3.10.8"]

[project.scripts]
cellio = "cellio.cli:main"

[project.entry-points."cellio.scene_plugins"]
cell_a = "cellio.plugins.reference:cell_a"
cell_b = "cellio.plugins.reference:cell_b"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cellio.inspection" = ["examples/*.json"]
"cellio.inspection.study" = ["*.usdc", "*.png", "*.md", "*.usda"]

[tool.setuptools.data-files]
"share/cellio" = ["THIRD_PARTY_NOTICES.md"]
"share/cellio/docs" = ["docs/cell_c.md"]
"share/cellio/fixtures/oracle" = ["fixtures/oracle/gold.json", "fixtures/oracle/gold.sha256"]
"share/cellio/schemas" = ["schemas/*.json"]
"share/cellio/protocols" = ["protocols/*.yaml", "protocols/*.json"]
"share/cellio/examples/cell_a" = ["examples/cell_a/*.yaml"]
"share/cellio/examples/cell_b" = ["examples/cell_b/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.format]
line-ending = "lf"

