[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cellio"
version = "1.0.0.dev0"
description = "Scene-bound I/O fault injection and regression testing for robotic workcells"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
dependencies = ["PyYAML>=6,<7", "jsonschema>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "hypothesis>=6,<7", "coverage>=7,<8", "mypy>=1,<2", "ruff>=0,<1"]

[project.scripts]
cellio = "cellio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

